<!DOCTYPE html>
<html lang='en'>
<head>
    <meta charset='UTF-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1.0, user-scalable=no'>
    <meta name='mobile-web-app-capable' content='yes'>
    <meta name='apple-mobile-web-app-capable' content='yes'>
    <title>SYNAPTIC OVERLORD V10</title>
    <style>
        body { background: #000; color: #00f2ff; font-family: 'Segoe UI', sans-serif; margin: 0; overflow-x: hidden; }
        .bg-animate { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; background: radial-gradient(circle at 50% 50%, #001a1a 0%, #000 100%); }
        .container { padding: 20px; text-align: center; max-width: 600px; margin: auto; }
        .glass-card { background: rgba(0, 242, 255, 0.05); border: 1px solid #00f2ff; border-radius: 25px; padding: 25px; backdrop-filter: blur(10px); box-shadow: 0 0 30px rgba(0,242,255,0.2); }
        .timer { font-family: 'Courier New', monospace; font-size: 3.5rem; color: #ff0055; text-shadow: 0 0 15px #ff0055; margin: 20px 0; }
        input { width: 85%; padding: 18px; border-radius: 15px; border: 1px solid #00f2ff; background: rgba(0,0,0,0.5); color: #fff; font-size: 1.1rem; }
        .btn-launch { width: 100%; padding: 20px; margin-top: 15px; background: #00f2ff; color: #000; border: none; border-radius: 15px; font-weight: 900; font-size: 1.3rem; transition: 0.3s; }
        .btn-launch:active { transform: scale(0.95); background: #fff; }
        .preview-grid { display: grid; grid-template-columns: 1fr; gap: 15px; margin-top: 25px; }
        .view { border-radius: 15px; overflow: hidden; border: 1px solid #333; min-height: 200px; }
        img { width: 100%; display: block; }
    </style>
</head>
<body>
    <div class='bg-animate'></div>
    <div class='container'>
        <div class='glass-card'>
            <h2 style='letter-spacing: 5px;'>☳ SYNAPTIC_OVERLORD</h2>
            <p style='color: #666;'>ANDROID_NODE_ACTIVE | TESLA_T4</p>
            <div class='timer' id='clock'>00:00:00</div>
            <input type='text' id='p' placeholder='Input Synthesis Macro...'>
            <button class='btn-launch' onclick='run()'>INITIATE V10 SYNTHESIS</button>
        </div>
        <div class='preview-grid'>
            <div class='view' id='v'><p style='padding:50px; color:#333;'>AWAITING GPU SIGNAL...</p></div>
        </div>
    </div>
    <script>
        let s = 0; let iv;
        async function run() {
            const prompt = document.getElementById('p').value;
            document.getElementById('v').innerHTML = '<p>CONNECTING TO CLOUD GPU...</p>';
            s = 0; clearInterval(iv);
            iv = setInterval(() => { s++; let d = new Date(s * 1000).toISOString().substr(11, 8); document.getElementById('clock').innerText = d; }, 1000);
            await google.colab.kernel.invokeFunction('RunV6', [prompt], {});
            clearInterval(iv);
            document.getElementById('v').innerHTML = `<img src="angel_macro_4k.png?t=${Date.now()}">`;
        }
    </script>
</body>
</html>
