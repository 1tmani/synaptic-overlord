<!DOCTYPE html>
<html>
<head>
    <meta name='viewport' content='width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no'>
    <title>SYNAPTIC MOBILE</title>
    <style>
        body { background: #000; color: #00f2ff; font-family: sans-serif; margin: 0; padding: 15px; text-align: center; }
        .app-card { border: 2px solid #00f2ff; border-radius: 20px; padding: 20px; background: #0a0a0a; box-shadow: 0 0 20px #00f2ff55; }
        .timer-display { font-size: 3rem; font-weight: bold; color: #ff0055; margin: 20px 0; }
        input { width: 90%; padding: 15px; border-radius: 10px; border: 1px solid #444; background: #111; color: #fff; margin-bottom: 10px; }
        .action-btn { width: 100%; padding: 20px; background: #00f2ff; color: #000; border-radius: 15px; font-weight: bold; font-size: 1.2rem; border: none; }
        #img-container { margin-top: 20px; min-height: 300px; border: 1px dashed #333; display: flex; align-items: center; justify-content: center; }
        img { width: 100%; border-radius: 10px; }
    </style>
</head>
<body>
    <div class='app-card'>
        <h1>☳ SYNAPTIC_PAD_V6</h1>
        <div class='timer-display' id='timer'>00:00</div>
        <input type='text' id='prompt' placeholder='Type Angel Command...'>
        <button class='action-btn' onclick='startSync()'>INITIATE REAL-TIME GENERATION</button>
        <div id='img-container'>AWAITING SIGNAL...</div>
    </div>
    <script>
        let seconds = 0;
        let interval;

        async function startSync() {
            const p = document.getElementById('prompt').value;
            document.getElementById('img-container').innerHTML = 'SYNTHESIZING ON CLOUD GPU...';
            seconds = 0;
            interval = setInterval(() => {
                seconds++;
                let m = Math.floor(seconds / 60); let s = seconds % 60;
                document.getElementById('timer').innerText = `${m}:${s < 10 ? '0' : ''}${s}`;
            }, 1000);

            const r = await google.colab.kernel.invokeFunction('RunV6', [p], {});
            clearInterval(interval);
            document.getElementById('img-container').innerHTML = `<img src="angel_macro_4k.png?t=${Date.now()}">`;
        }
    </script>
</body>
</html>
